[sandbox_workspace_write]
network_access = true

[mcp_servers.atlassian]
command = "npx"
args = [
  "--cache",
  ".cache/npm-mcp",
  "-y",
  "mcp-atlassian@2.0.1"
]
env_vars = ["ATLASSIAN_EMAIL", "ATLASSIAN_API_TOKEN"]
startup_timeout_sec = 30
tool_timeout_sec = 60
required = false

[mcp_servers.atlassian.env]
ATLASSIAN_BASE_URL = "https://theinsgroup.atlassian.net"

[mcp_servers.atlassian.tools.search_jira_issues]
approval_mode = "approve"

[mcp_servers.atlassian.tools.search_confluence_pages]
approval_mode = "approve"

[mcp_servers.atlassian.tools.download_confluence_page_complete]
approval_mode = "approve"

[mcp_servers.atlassian.tools.export_confluence_page]
approval_mode = "approve"

[mcp_servers.atlassian.tools.read_jira_issue]
approval_mode = "approve"

[mcp_servers.atlassian.tools.read_confluence_page]
approval_mode = "approve"
