# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "INS LifeGuardian"

[setup]
script = '''
set -euo pipefail

worktree_path="${CODEX_WORKTREE_PATH:-}"
if [ -z "$worktree_path" ]; then
  worktree_path="$(git rev-parse --show-toplevel)"
fi
cd "$worktree_path"

echo "Preparing INS LifeGuardian QA repository..."
echo "Repository: $(pwd)"
echo "Python: $(python3 --version)"

required_files=(
  "AGENTS.md"
  "qa-knowledge/index.md"
  "qa-knowledge/config.yml"
  "scripts/validate_qa_test_cases.py"
  "scripts/validate_qa_knowledge.py"
)

for file in "${required_files[@]}"; do
  if [ ! -f "$file" ]; then
    echo "ERROR: Required repository file is missing: $file"
    exit 1
  fi

  echo "FOUND: $file"
done

echo "Checking Python validator syntax..."
PYTHONPYCACHEPREFIX="${TMPDIR:-/tmp}/ins-lifeguardian-pycache" \
  python3 -m py_compile scripts/*.py

echo "Running QA knowledge validation..."
python3 scripts/validate_qa_knowledge.py

if [ "${QA_MIGRATION_MODE:-false}" = "true" ]; then
  echo "Running QA validation in explicit migration mode..."
  python3 scripts/validate_qa_test_cases.py --allow-empty
else
  echo "Running strict QA validation..."
  python3 scripts/validate_qa_test_cases.py
fi

if [ -n "${ATLASSIAN_EMAIL:-}" ] && [ -n "${ATLASSIAN_API_TOKEN:-}" ]; then
  python3 scripts/check_atlassian_mcp.py
else
  echo "WARNING: Atlassian credentials are not configured; Jira evidence must be reported under Could Not Verify."
fi

echo "INS LifeGuardian QA environment is ready."'''

[cleanup]
script = '''
set -euo pipefail

worktree_path="${CODEX_WORKTREE_PATH:-}"
if [ -z "$worktree_path" ]; then
  worktree_path="$(git rev-parse --show-toplevel)"
fi
cd "$worktree_path"

if [ -d ".cache/tmp" ]; then
  rm -rf .cache/tmp
fi'''
