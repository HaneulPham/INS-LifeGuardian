name: QA knowledge validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py
      - name: Run validator unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Check Codex prompt budget
        run: python3 scripts/check_prompt_budget.py
      - name: Validate QA knowledge
        run: python3 scripts/validate_qa_knowledge.py
      - name: Validate QA test cases
        run: python3 scripts/validate_qa_test_cases.py
